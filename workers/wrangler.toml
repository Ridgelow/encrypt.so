"$schema" = "./node_modules/wrangler/config-schema.json"
name = "encrypt-so-api"
main = "src/index.ts"
compatibility_date = "2026-09-22"

# Placeholder IDs. `wrangler dev` uses local D1 and KV and does not call Cloudflare.
# Replace both values after creating the resources (see README.md) before `wrangler deploy`.

[[d1_databases]]
binding = "DB"
database_name = "encrypt-so"
database_id = "14bda5dd-432f-4135-baa0-8eb91f96afb1"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "f1e4f075fa6a4229875a0060be0c1087"

# One Durable Object per 1:1 conversation. Both members' sockets live in that
# object, so fan-out is a local broadcast. A per-user inbox would need a second
# hop to the peer's object on every message.
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]

# Per-user socket count across conversation objects. Not a message inbox.
[[durable_objects.bindings]]
name = "USER_GATES"
class_name = "UserGate"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserGate"]

# Delete expired ciphertext and attachment pointers. Lists also purge the conversation they read.
[triggers]
crons = ["*/15 * * * *"]

# Guardrails. Empty blocklists allow everyone. Set a value to 0 to disable that limiter
# or, for MESSAGE_TTL_MS, to keep rows until their disappearing expire_at.
# Secrets (EXPO_ACCESS_TOKEN) are not listed here.
[vars]
MESSAGE_TTL_MS = "2592000000"
RATE_AUTH_START_PER_PHONE = "8"
RATE_AUTH_START_PER_IP = "30"
RATE_AUTH_START_WINDOW_SEC = "600"
RATE_AUTH_VERIFY_PER_IP = "40"
RATE_AUTH_VERIFY_WINDOW_SEC = "600"
RATE_MESSAGE_PER_USER = "60"
RATE_MESSAGE_PER_IP = "120"
RATE_MESSAGE_WINDOW_SEC = "60"
RATE_PUSH_PER_USER = "10"
RATE_PUSH_PER_IP = "20"
RATE_PUSH_WINDOW_SEC = "60"
RATE_ATTACHMENT_PER_USER = "30"
RATE_ATTACHMENT_PER_IP = "60"
RATE_ATTACHMENT_WINDOW_SEC = "60"
MAX_BODY_BYTES = "65536"
MAX_CIPHERTEXT_CHARS = "49152"
MAX_ATTACHMENT_BYTES = "26214400"
MAX_WS_PER_CONVERSATION = "32"
MAX_WS_PER_USER = "8"
MAX_WS_PER_USER_GLOBAL = "16"
AUTH_FAIL_BACKOFF_BASE_MS = "1000"
AUTH_FAIL_BACKOFF_MAX_MS = "900000"
BLOCKLIST_PHONES = ""
BLOCKLIST_IPS = ""

# Ciphertext blobs only. `wrangler dev` simulates this bucket locally.
# Create the remote bucket before `wrangler deploy` (see README.md).
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "encrypt-so-attachments"

# Optional secret, not a [vars] entry. When unset, push delivery is stubbed.
#   npx wrangler secret put EXPO_ACCESS_TOKEN
