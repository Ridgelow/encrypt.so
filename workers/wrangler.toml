"$schema" = "./node_modules/wrangler/config-schema.json"
name = "encrypt-so-api"
main = "src/index.ts"
compatibility_date = "2026-09-22"

# Placeholder IDs. `wrangler dev` uses local D1 and KV and does not call Cloudflare.
# Replace both values after creating the resources (see README.md) before `wrangler deploy`.

[[d1_databases]]
binding = "DB"
database_name = "encrypt-so"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "00000000000000000000000000000000"
